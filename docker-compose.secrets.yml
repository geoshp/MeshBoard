# Дополнение: пароли через Docker secrets вместо переменных окружения.
# Файлы создаются вручную и не попадают в git (каталог secrets/ в .gitignore):
#   secrets/meshboard_password.txt     — пароль входа в дашборд
#   secrets/repeater_passwords.txt     — строки вида  префикс_ключа_или_имя=пароль
# docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d
services:
  meshboard:
    environment:
      MESHBOARD_PASSWORD_FILE: /run/secrets/meshboard_password
      MESHBOARD_REPEATER_PASSWORDS_FILE: /run/secrets/repeater_passwords
    secrets:
      - meshboard_password
      - repeater_passwords

secrets:
  meshboard_password:
    file: ./secrets/meshboard_password.txt
  repeater_passwords:
    file: ./secrets/repeater_passwords.txt
